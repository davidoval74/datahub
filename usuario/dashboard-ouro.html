<div class="btc-dash-header">
    <div>
        <h2><i class="fa-solid fa-trophy" style="color:#FFD700;"></i> Dashboard Ouro</h2>
        <p>Preços de Ouro via pipeline ETL dedicado (Gold API + Python) — dados mais recentes primeiro.</p>
    </div>
    <button type="button" id="loadCryptoPricesBtn" class="tool-action-btn">
        <i class="fa-solid fa-rotate"></i> Atualizar
    </button>
</div>
<div class="date-filter-fixed" role="status" aria-live="polite">
    <span class="date-filter-pill"><i class="fa-regular fa-calendar"></i> Filtro ativo</span>
    <span class="date-filter-window" id="dateFilterLabel">Ultimos 30 dias</span>
    <span class="date-filter-boundary" id="dateFilterStart">--/--/----</span>
    <span class="date-filter-sep">ate</span>
    <span class="date-filter-boundary" id="dateFilterEnd">--/--/----</span>
    <div class="date-filter-controls">
        <label class="date-input-group" for="dateFilterStartInput">
            <span>De</span>
            <input id="dateFilterStartInput" type="date">
        </label>
        <label class="date-input-group" for="dateFilterEndInput">
            <span>Ate</span>
            <input id="dateFilterEndInput" type="date">
        </label>
        <button type="button" id="applyDateFilterBtn" class="date-filter-btn date-filter-btn-primary">Aplicar</button>
        <button type="button" id="resetDateFilterBtn" class="date-filter-btn">Ultimos 30 dias</button>
    </div>
</div>
<div id="cryptoPricesFeedback" class="tool-feedback" aria-live="polite"></div>
<div id="btcKpiRow" class="btc-kpi-row" hidden>
    <div class="btc-kpi"><span class="btc-kpi-label">Último preço</span><span class="btc-kpi-value" id="btcCurrentPrice">—</span></div>
    <div class="btc-kpi"><span class="btc-kpi-label">Máxima</span><span class="btc-kpi-value btc-kpi-high" id="btcHighPrice">—</span></div>
    <div class="btc-kpi"><span class="btc-kpi-label">Mínima</span><span class="btc-kpi-value btc-kpi-low" id="btcLowPrice">—</span></div>
    <div class="btc-kpi"><span class="btc-kpi-label">Variação total</span><span class="btc-kpi-value" id="btcPriceChange">—</span></div>
</div>
<div id="btcChartWrapper" class="btc-chart-wrapper" hidden>
    <canvas id="btcPriceChart" aria-label="Gráfico de evolução do preço do Ouro"></canvas>
</div>
<div id="cryptoPricesResult" class="crypto-prices-result" hidden></div>
